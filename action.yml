name: 'Aysal-Scan'
description: 'Find leaked secrets, verify which are live, and score how urgent each one is'
author: 'Neeraj Mudunuru'

inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  min-severity:
    description: 'Lowest severity to DISPLAY (CRITICAL/HIGH/MEDIUM/LOW/INFO)'
    required: false
    default: 'HIGH'
  fail-on:
    description: 'Fail the job if a finding is at/above this severity (CRITICAL/HIGH/MEDIUM/LOW/INFO/NONE)'
    required: false
    default: 'HIGH'
  fail-on-findings:
    description: 'Set to false to never fail the job because of findings (scan errors still fail)'
    required: false
    default: 'true'
  history:
    description: 'Also scan git history: none, full, or a number of commits (needs fetch-depth: 0 for full)'
    required: false
    default: 'none'
  no-blast-radius:
    description: 'Do not verify credentials with their providers (offline mode)'
    required: false
    default: 'false'
  config:
    description: 'Path to an aysal-scan.toml configuration file'
    required: false
    default: ''

outputs:
  findings-count:
    description: 'Number of findings at or above min-severity'
  report-path:
    description: 'Path to the HTML report'
  sarif-path:
    description: 'Path to the SARIF report'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/rolex-1905/aysal-scan:latest'

branding:
  icon: 'shield'
  color: 'red'
