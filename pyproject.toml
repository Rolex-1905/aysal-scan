[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aysal-scan"
version = "2.0.0rc1"
description = "Find leaked secrets in git repos, verify which are live, and score how urgent each one is"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["secrets", "security", "git", "scanner", "devsecops", "credentials", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [
    { name = "Neeraj Mudunuru" },
]

dependencies = [
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<15.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "gitpython>=3.1.40,<4.0.0",
    "boto3>=1.34.0,<2.0.0",
    "pathspec>=0.12.0,<2.0.0",
]

[project.optional-dependencies]
ui = [
    "questionary>=2.0.0,<3.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "respx>=0.21.0,<1.0.0",
]

[project.scripts]
aysal-scan = "aysal_scan.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aysal_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=aysal_scan --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["aysal_scan"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError",
]

[project.urls]
Issues = "https://github.com/Rolex-1905/aysal-scan/issues"
Changelog = "https://github.com/Rolex-1905/aysal-scan/blob/main/CHANGELOG.md"
Homepage = "https://github.com/Rolex-1905/aysal-scan"
Repository = "https://github.com/Rolex-1905/aysal-scan"
LinkedIn = "https://www.linkedin.com/in/neeraj-mudunuru-79130a29a/"
