name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,ui]"
      - name: Run tests with coverage gate
        run: pytest

  self-scan:
    name: Self-scan for leaked secrets
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Scan working tree and full history (fails on HIGH or worse)
        run: |
          aysal-scan scan . --no-blast-radius --fail-on HIGH --output-sarif aysal.sarif
          aysal-scan scan . --full-history --no-blast-radius --fail-on HIGH --min-severity HIGH
      - name: Upload SARIF to the Security tab
        if: always() && hashFiles('aysal.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aysal.sarif
          category: aysal-scan
