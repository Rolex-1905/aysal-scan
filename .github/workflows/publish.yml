name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches version and tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag must equal v<version in pyproject.toml>
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag!r} does not match pyproject version {version!r}. "
                       "PyPI versions are immutable: fix the tag or the version before publishing.")
          print(f"Tag {tag} matches version {version}")
          PY
      - run: pip install -e ".[dev,ui]"
      - run: pytest

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
